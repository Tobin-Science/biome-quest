Pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}\n  @keyframes mgFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:fixed;inset:0;background:radial-gradient(130% 120% at 50% 0%,#2a2236 0%,#0d0c14 70%);display:flex;align-items:center;justify-content:center;padding:22px;font-family:'Lexend',system-ui,sans-serif\">\n  <div style=\"width:100%;max-width:820px;position:relative\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#eef0ff\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:#b6a8e0\">Adaptation Dash<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#7c63ff;background:#7c63ff18;padding:5px 12px;border-radius:20px\">S7L5 · Adaptation<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px -28px rgba(0,0,0,.75);border:2px solid rgba(255,255,255,.08)\">\n      <canvas ref=\"{{ setCanvas }}\" style=\"display:block;width:100%;height:470px;touch-action:none;cursor:pointer\"><\u002Fcanvas>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;top:39px;display:flex;align-items:center;justify-content:center;animation:mgFade .4s ease both\">\n        <div style=\"background:#fbfaf6;border-radius:20px;padding:36px 40px;text-align:center;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);max-width:560px\">\n          <div style=\"font-size:50px\">🏃<\u002Fdiv>\n          <h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:33px;font-weight:700;color:#1c1d33;margin:8px 0 6px\">Adaptation Dash<\u002Fh1>\n          <p style=\"font-size:16px;color:#4a4c68;line-height:1.6;margin:0 auto 14px\">Your creature races through changing habitats. Read the <strong>environment<\u002Fstrong> ahead and <strong>switch lanes<\u002Fstrong> to grab the <strong>adaptation that helps it survive<\u002Fstrong>. Wrong trait = you don't make it.<\u002Fp>\n          <div style=\"display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px\">\n            <div style=\"background:#f0eee6;border-radius:10px;padding:8px 13px;font-size:13px;color:#3c3d57\">⬆️⬇️ Arrows / tap lane<\u002Fdiv>\n            <div style=\"background:#f0eee6;border-radius:10px;padding:8px 13px;font-size:13px;color:#3c3d57\">❤️ 3 lives<\u002Fdiv>\n            <div style=\"background:#f0eee6;border-radius:10px;padding:8px 13px;font-size:13px;color:#3c3d57\">🔥 Streak = combo<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ start }}\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;color:#fff;background:linear-gradient(135deg,#9b7cff,#6a4fe0);border:none;border-radius:13px;padding:14px 44px;cursor:pointer;box-shadow:0 10px 24px -8px #6a4fe0aa\">Dash<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isOver }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;top:39px;display:flex;align-items:center;justify-content:center;animation:mgPop .4s ease both\">\n        <div style=\"background:#fbfaf6;border-radius:20px;padding:34px 40px;text-align:center;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)\">\n          <div style=\"font-size:48px\">🏅<\u002Fdiv>\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:#1c1d33;margin:4px 0 4px\">Dash Over!<\u002Fh2>\n          <p style=\"font-size:15px;color:#5a5c78;margin:0 0 22px\">You adapted to <strong>{{ correct }}<\u002Fstrong> habitats · best streak <strong>{{ best }}<\u002Fstrong>.<\u002Fp>\n          <div style=\"display:flex;gap:13px;justify-content:center;margin-bottom:26px;flex-wrap:wrap\">\n            <div style=\"background:#2fa36b14;border:1px solid #2fa36b40;border-radius:13px;padding:14px 24px\"><div style=\"font-size:12px;color:#2fa36b;font-weight:600\">GOLD<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:#1c1d33\">{{ gold }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#7c63ff14;border:1px solid #7c63ff40;border-radius:13px;padding:14px 24px\"><div style=\"font-size:12px;color:#7c63ff;font-weight:600\">XP<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:#1c1d33\">{{ xp }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#9b7cff14;border:1px solid #9b7cff40;border-radius:13px;padding:14px 24px\"><div style=\"font-size:12px;color:#6a4fe0;font-weight:600\">SCORE<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;color:#1c1d33\">{{ score }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;justify-content:center\">\n            <button onclick=\"{{ playAgain }}\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:#1c1d33;background:#eceae2;border:1px solid #d9d5c8;border-radius:12px;padding:12px 28px;cursor:pointer\">Dash Again<\u002Fbutton>\n            <button onclick=\"{{ leave }}\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,#9b7cff,#6a4fe0);border:none;border-radius:12px;padding:12px 28px;cursor:pointer\">Collect &amp; Leave<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { phase:'intro', score:0, correct:0, best:0, gold:0, xp:0 };\n  SCEN=[\n    { env:'Freezing cold', icon:'\\u2744\\uFE0F', col:'#7db4d8', good:{e:'\\uD83E\\uDDE5',l:'Thick fur'}, bad:[{e:'\\uD83D\\uDCA7',l:'Thin skin'},{e:'\\u2600\\uFE0F',l:'Light coat'}] },\n    { env:'Scorching desert', icon:'\\uD83C\\uDFDC\\uFE0F', col:'#e6994c', good:{e:'\\uD83D\\uDC2A',l:'Stores water'}, bad:[{e:'\\uD83E\\uDDE5',l:'Thick fur'},{e:'\\uD83C\\uDF0A',l:'Gills'}] },\n    { env:'Sooty dark forest', icon:'\\uD83C\\uDFED', col:'#5a5f6e', good:{e:'\\u26AB',l:'Dark camo'}, bad:[{e:'\\u26AA',l:'Pale color'},{e:'\\uD83D\\uDD34',l:'Bright color'}] },\n    { env:'Deep water', icon:'\\uD83C\\uDF0A', col:'#4cc9f0', good:{e:'\\uD83D\\uDC1F',l:'Gills & fins'}, bad:[{e:'\\uD83E\\uDEC1',l:'Lungs only'},{e:'\\uD83E\\uDDB5',l:'Long legs'}] },\n    { env:'Tall trees, high leaves', icon:'\\uD83C\\uDF33', col:'#2fa36b', good:{e:'\\uD83E\\uDD92',l:'Long neck'}, bad:[{e:'\\uD83D\\uDC1B',l:'Tiny body'},{e:'\\uD83E\\uDD97',l:'Jump legs'}] },\n    { env:'Hard tough seeds', icon:'\\uD83C\\uDF30', col:'#9a6a3c', good:{e:'\\uD83E\\uDD9C',l:'Strong beak'}, bad:[{e:'\\uD83E\\uDEB6',l:'Thin beak'},{e:'\\uD83D\\uDC1D',l:'Long tongue'}] },\n    { env:'Fast predators', icon:'\\uD83D\\uDC06', col:'#f0606a', good:{e:'\\uD83D\\uDCA8',l:'Fast legs'}, bad:[{e:'\\uD83D\\uDC0C',l:'Slow shell'},{e:'\\uD83C\\uDF08',l:'Bright color'}] },\n    { env:'Night hunting', icon:'\\uD83C\\uDF19', col:'#7c63ff', good:{e:'\\uD83D\\uDC41\\uFE0F',l:'Night vision'}, bad:[{e:'\\uD83C\\uDF08',l:'Color eyes'},{e:'\\uD83D\\uDE34',l:'Sleeps at night'}] },\n  ];\n\n  renderVals(){\n    const s=this.state;\n    return {\n      isIntro:s.phase==='intro', isOver:s.phase==='over',\n      setCanvas:(el)=>{ this.canvasEl=el; if(el) this.ensureSetup(); },\n      start:()=>this.start(), playAgain:()=>this.start(), leave:()=>this.leave(),\n      score:s.score, correct:s.correct, best:s.best, gold:s.gold, xp:s.xp,\n    };\n  }\n\n  ensureSetup(){\n    if(this._setup) return; this._setup=true;\n    const el=this.canvasEl;\n    el.addEventListener('pointerdown',e=>{ const r=el.getBoundingClientRect(); this.aimLane((e.clientY-r.top)); });\n    this._kd=(e)=>{ if(e.code==='ArrowUp'){ e.preventDefault(); this.setLane(this.g?this.g.lane-1:0); } else if(e.code==='ArrowDown'){ e.preventDefault(); this.setLane(this.g?this.g.lane+1:0); } };\n    window.addEventListener('keydown',this._kd);\n    this.resize(); window.addEventListener('resize',()=>{ this.resize(); this.lanesY(); if(this.state.phase!=='play') this.drawIdle(); });\n    this.drawIdle();\n  }\n  resize(){\n    const el=this.canvasEl; if(!el) return;\n    const w=el.clientWidth||760, h=el.clientHeight||470, dpr=Math.min(devicePixelRatio,1.5);\n    el.width=w*dpr; el.height=h*dpr; this.ctx=el.getContext('2d'); this.ctx.setTransform(dpr,0,0,dpr,0,0);\n    this.W=w; this.H=h; this.lanesY();\n  }\n  lanesY(){ const top=66, H=this.H; this.LY=[top+(H-top)*0.2, top+(H-top)*0.5, top+(H-top)*0.8]; }\n  aimLane(y){ if(!this.g) return; let best=0,bd=1e9; for(let i=0;i<3;i++){ const d=Math.abs(this.LY[i]-y); if(d<bd){bd=d;best=i;} } this.setLane(best); }\n  setLane(i){ if(!this.g) return; this.g.lane=Math.max(0,Math.min(2,i)); }\n\n  spawnGroup(){\n    const g=this.g;\n    const sc=this.SCEN[Math.floor(Math.random()*this.SCEN.length)];\n    const opts=[sc.good,sc.bad[0],sc.bad[1]];\n    // shuffle lane assignment\n    const lanes=[0,1,2]; for(let i=lanes.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=lanes[i];lanes[i]=lanes[j];lanes[j]=t; }\n    const tokens=opts.map((o,i)=>({ lane:lanes[i], e:o.e, l:o.l, good:o===sc.good }));\n    g.groups.push({ x:this.W+60, env:sc.env, icon:sc.icon, col:sc.col, tokens, resolved:false });\n  }\n\n  start(){\n    this.resize();\n    this.g={ score:0, correct:0, best:0, combo:0, lives:3, t:0, lane:1, py:this.LY[1], speed:120, groups:[], parts:[], scroll:0, flash:null };\n    this._dead=false; this.spawnGroup();\n    this.setState({ phase:'play', score:0, correct:0, best:0 });\n    this._last=performance.now(); cancelAnimationFrame(this._raf);\n    const loop=(now)=>{ this._raf=requestAnimationFrame(loop); this.frame(now); };\n    this._raf=requestAnimationFrame(loop);\n  }\n\n  frame(now){\n    if(this.state.phase!=='play') return;\n    let dt=(now-this._last)/1000; this._last=now; if(dt>0.05) dt=0.05;\n    const g=this.g, W=this.W;\n    g.t+=dt; g.speed=Math.min(120+g.t*3,260); g.scroll+=g.speed*dt;\n    // player y ease\n    const ty=this.LY[g.lane]; g.py += (ty-g.py)*Math.min(1,dt*13);\n    const collectX=W*0.2;\n    // spawn spacing\n    const last=g.groups[g.groups.length-1];\n    if(!last || (W - last.x) > 660){ this.spawnGroup(); }\n    for(const grp of g.groups){ grp.x -= g.speed*dt;\n      if(!grp.resolved && grp.x <= collectX){\n        grp.resolved=true;\n        const tok=grp.tokens.find(t=>t.lane===g.lane);\n        const ok = tok && tok.good;\n        if(ok){ const gained=12+g.combo*2; g.score+=gained; g.correct++; g.combo++; g.best=Math.max(g.best,g.combo); g.flash={t:.4,c:'#43c785'}; this.burst(collectX,g.py,'#43c785'); }\n        else { g.lives--; g.combo=0; g.flash={t:.5,c:'#f0606a'}; this.burst(collectX,g.py,'#f0606a'); if(g.lives<=0) this._dead=true; }\n        grp.hitLane=g.lane; grp.ok=ok;\n      }\n    }\n    g.groups=g.groups.filter(grp=>grp.x>-120);\n    if(g.flash){ g.flash.t-=dt; if(g.flash.t<=0) g.flash=null; }\n    for(const p of g.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }\n    g.parts=g.parts.filter(p=>p.life>0);\n    this.draw();\n    if(this._dead && g.parts.length===0) this.end();\n  }\n  burst(x,y,c){ for(let i=0;i<13;i++){ const a=Math.random()*7, sp=80+Math.random()*180; this.g.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.45+Math.random()*.3,c}); } }\n\n  draw(){\n    const ctx=this.ctx, W=this.W, H=this.H, g=this.g; if(!ctx) return;\n    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#33294f'); bg.addColorStop(1,'#181225');\n    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);\n    if(g.flash){ ctx.fillStyle=g.flash.c+'1f'; ctx.fillRect(0,0,W,H); }\n    // lanes\n    for(let i=0;i<3;i++){ ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1.5; ctx.setLineDash([10,12]); ctx.lineDashOffset=-g.scroll%22; ctx.beginPath(); ctx.moveTo(0,this.LY[i]); ctx.lineTo(W,this.LY[i]); ctx.stroke(); }\n    ctx.setLineDash([]);\n    // approaching env banner (nearest unresolved group)\n    const next=g.groups.find(gr=>!gr.resolved);\n    ctx.fillStyle='rgba(0,0,0,.3)'; this.rr(12,12,W-24,42,11); ctx.fill();\n    if(next){ ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.font='22px sans-serif'; ctx.fillText(next.icon,26,34);\n      ctx.fillStyle='#fff'; ctx.font='700 17px \"Space Grotesk\",sans-serif'; ctx.fillText('Habitat ahead: '+next.env, 56, 34);\n      ctx.textAlign='right'; ctx.fillStyle=next.col; ctx.font='600 13px \"Lexend\",sans-serif'; ctx.fillText('pick the matching adaptation', W-26, 34); }\n    // collect line\n    const collectX=W*0.2;\n    ctx.strokeStyle='rgba(155,124,255,.4)'; ctx.lineWidth=2; ctx.setLineDash([5,6]); ctx.beginPath(); ctx.moveTo(collectX,60); ctx.lineTo(collectX,H); ctx.stroke(); ctx.setLineDash([]);\n    // groups/tokens\n    for(const grp of g.groups){ for(const t of grp.tokens){ const x=grp.x, y=this.LY[t.lane];\n      const passed=grp.resolved;\n      let cardCol = passed ? (t.good?'#43c785':'rgba(255,255,255,.10)') : 'rgba(255,255,255,.10)';\n      let bdCol = passed ? (t.good?'#43c785':(grp.hitLane===t.lane?'#f0606a':'rgba(255,255,255,.18)')) : grp.col+'aa';\n      ctx.fillStyle=cardCol; this.rr(x-44,y-32,88,64,14); ctx.fill();\n      ctx.strokeStyle=bdCol; ctx.lineWidth=2.5; this.rr(x-44,y-32,88,64,14); ctx.stroke();\n      ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.e,x,y-7);\n      ctx.fillStyle='#eef0ff'; ctx.font='600 11.5px \"Lexend\",sans-serif'; ctx.fillText(t.l,x,y+18);\n    } }\n    // player creature\n    if(!(g.flash && g.flash.c==='#f0606a' && Math.floor(g.t*16)%2===0)){\n      ctx.save(); ctx.translate(collectX,g.py);\n      ctx.fillStyle='rgba(155,124,255,.25)'; ctx.beginPath(); ctx.arc(0,0,28,0,7); ctx.fill();\n      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,21,0,7); ctx.fill();\n      ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('\\uD83E\\uDDA6',0,1);\n      ctx.restore();\n    }\n    for(const p of g.parts){ ctx.globalAlpha=Math.max(0,p.life*2); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); } ctx.globalAlpha=1;\n    // HUD\n    ctx.fillStyle='#fff'; ctx.font='bold 19px \"Space Grotesk\",sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText('Score '+g.score, 14, H-30);\n    if(g.combo>=2){ ctx.fillStyle='#e6b84c'; ctx.font='700 15px \"Space Grotesk\",sans-serif'; ctx.fillText('\\uD83D\\uDD25 \\u00d7'+g.combo, 120, H-28); }\n    for(let i=0;i<3;i++){ ctx.font='18px sans-serif'; ctx.textAlign='left'; ctx.fillText(i<g.lives?'\\u2764\\uFE0F':'\\uD83D\\uDDA4', W-30-i*26, H-30); }\n  }\n  drawIdle(){ this.resize(); const ctx=this.ctx,W=this.W,H=this.H; if(!ctx)return; const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#33294f'); bg.addColorStop(1,'#181225'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H); }\n  rr(x,y,w,h,r){ const ctx=this.ctx; r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }\n\n  end(){ cancelAnimationFrame(this._raf); const g=this.g; this.setState({ phase:'over', score:g.score, correct:g.correct, best:g.best, gold:g.correct*5, xp:g.score }, ()=>this.postMsg('complete')); }\n  leave(){ this.postMsg('exit'); this.setState({phase:'intro'}, ()=>this.drawIdle()); }\n  postMsg(event){ try{ if(window.parent && window.parent!==window){ window.parent.postMessage({ source:'biomequest-minigame', game:'adaptation-dash', standard:'S7L5', event, gold:this.state.gold, xp:this.state.xp, score:this.state.score, correct:this.state.correct }, '*'); } }catch(e){} }\n  componentWillUnmount(){ cancelAnimationFrame(this._raf); if(this._kd) window.removeEventListener('keydown',this._kd); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
